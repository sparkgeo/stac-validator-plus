[project]
name = "stac-validator-plus"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "loguru~=0.7.3",
    "pystac-client~=0.9.0",
    "jinja2~=3.1.6",
    "httpx~=0.28.1",
    "fsspec~=2026.3.0",
    "stac-validator~=4.1.0",
    "stac-check~=1.14.0",
    "pystac~=1.14.3",
    "pydantic~=2.12.5",
    "rich-click~=1.9.7",
]

[project.scripts]
stac-validator-plus = "stac_validator_plus.cli:main"

[dependency-groups]
dev = [
    "pytest~=9.0.3",
    "ruff~=0.15.9",
    "pre-commit~=4.5.1"
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = ["uv sync", "git add uv.lock"]
post_commit_hooks = []
allow_shell_hooks = true

[build-system]
requires = ["uv_build>=0.11.4,<0.12"]
build-backend = "uv_build"
